<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b1d24'/%3E%3Cpath d='M14 45 27 15l7 17 16-13-13 30-7-17z' fill='%238a8dff' stroke='%23f4f5f8' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Web Viewer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%;background:#111318;color:#f4f5f8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.home{min-height:100vh;padding:28px}.apps{display:flex;gap:20px}.app{width:180px;padding:14px;border:1px solid #ffffff20;border-radius:20px;background:#1b1d24;color:#f4f5f8;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;font:inherit;transition:transform .16s,background .16s}.app:hover{transform:translateY(-3px);background:#252832}.browser-icon{width:144px;height:144px;display:grid;place-items:center;border-radius:18px;background:#f4f5f8}.browser-icon svg{width:104px;height:104px}.app-name{font-size:15px;font-weight:650}.viewer{display:none;position:fixed;inset:0;background:#111318;flex-direction:column}.tabs{height:44px;display:flex;align-items:center;padding:0 10px;background:#15161b;border-bottom:1px solid #ffffff17}.tab{height:34px;min-width:150px;display:flex;align-items:center;gap:9px;padding:0 12px;border-radius:9px 9px 0 0;background:#252730;color:#eee;font-size:13px}.tab-dot{width:11px;height:11px;border-radius:50%;background:#8a8dff}.toolbar{min-height:62px;display:flex;align-items:center;padding:9px 68px 9px 12px;background:#1b1d24;border-bottom:1px solid #ffffff17}.url-form{display:flex;flex:1;min-width:0;gap:8px}.url{flex:1;min-width:0;height:42px;padding:0 14px;border:1px solid #ffffff20;border-radius:10px;background:#101116;color:#f4f5f8;font:14px system-ui,sans-serif;outline:none}.url:focus{border-color:#8a8dff}.go{height:42px;padding:0 18px;border:0;border-radius:10px;background:#f4f5f8;color:#17181e;font-weight:700;cursor:pointer}.exit{position:absolute;z-index:3;top:9px;right:12px;width:38px;height:36px;border:0;border-radius:9px;background:#30323a;color:white;font-size:25px;cursor:pointer;line-height:1}.exit:hover{background:#494c57}.frame-wrap{position:relative;flex:1;min-height:0}.frame{width:100%;height:100%;border:0;background:white}.frame-note{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);padding:8px 12px;border:1px solid #ffffff20;border-radius:9px;background:#111318ef;color:#c1c2c9;font-size:12px;text-align:center}.frame-note a{color:white;white-space:nowrap}
</style>
</head>
<body>
<main class="home" id="home"><div class="apps"><button class="app" id="openBrowser" type="button" aria-label="Open Web Viewer"><span class="browser-icon" aria-hidden="true"><svg viewBox="0 0 100 100" fill="none" stroke="#514fc0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 79 43 20l9 31 31-27-27 59-10-31z" fill="#8a8dff"/><circle cx="50" cy="50" r="42" stroke="#26354a" stroke-width="4"/></svg></span><span class="app-name">Web Viewer</span></button></div></main>
<section class="viewer" id="viewer" aria-label="Web viewer"><div class="tabs"><div class="tab"><span class="tab-dot"></span><span>Web Viewer</span></div></div><div class="toolbar"><form class="url-form" id="urlForm"><input class="url" id="url" type="text" inputmode="url" autocomplete="url" spellcheck="false" aria-label="Website address" placeholder="Enter a website address"><button class="go" type="submit">Go</button></form></div><button class="exit" id="exit" type="button" aria-label="Close viewer and return to menu" title="Back to menu">×</button><div class="frame-wrap"><iframe class="frame" id="frame" title="Embedded website" sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe><div class="frame-note">Some sites block embedding. Network restrictions still apply. <a id="external" href="https://example.com/" target="_blank" rel="noopener">Open separately</a></div></div></section>
<script>
const home=document.getElementById('home'),viewer=document.getElementById('viewer'),field=document.getElementById('url'),frame=document.getElementById('frame'),external=document.getElementById('external');
function openViewer(){home.style.display='none';viewer.style.display='flex';field.focus()}function closeViewer(){viewer.style.display='none';home.style.display='block';frame.src='about:blank'}
function navigate(value){let address=value.trim();if(!address)return;if(!address.includes('://'))address='https://'+address;try{const parsed=new URL(address);if(!['http:','https:'].includes(parsed.protocol))throw new Error();field.value=parsed.href;external.href=parsed.href;frame.src=parsed.href}catch(_){field.setCustomValidity('Enter a valid http or https website address.');field.reportValidity();field.setCustomValidity('')}}
document.getElementById('openBrowser').addEventListener('click',openViewer);document.getElementById('urlForm').addEventListener('submit',event=>{event.preventDefault();navigate(field.value)});document.getElementById('exit').addEventListener('click',closeViewer);
document.addEventListener('keydown',event=>{if(event.key.toLowerCase()!=='p'||event.ctrlKey||event.altKey||event.metaKey||event.shiftKey)return;const target=event.target;if(target instanceof HTMLElement&&(target.isContentEditable||['INPUT','TEXTAREA','SELECT'].includes(target.tagName)))return;if(home.style.display!=='none'){event.preventDefault();openViewer()}});
</script>
</body>
</html>
