<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>Good School Studies</title>
  <style>
    * { box-sizing:border-box }
    html,body { margin:0; min-height:100%; background:#111318; font-family:system-ui,-apple-system,"Segoe UI",sans-serif }
    .google { position:fixed; top:14px; left:14px; width:48px; height:48px; display:grid; place-items:center; border:1px solid #ffffff1c; border-radius:13px; background:#1b1d24; color:white; text-decoration:none; font-family:Arial,sans-serif; font-size:29px; font-weight:700; transition:background .15s,transform .15s }
    .google:hover { background:#292b34; transform:translateY(-1px) }
    .google span { background:conic-gradient(from -45deg,#4285f4 0 25%,#34a853 25% 47%,#fbbc05 47% 70%,#ea4335 70% 84%,#4285f4 84%); color:transparent; background-clip:text; -webkit-background-clip:text }
  </style>
</head>
<body>
  <a class="google" href="https://www.google.com/" target="_blank" rel="noopener" aria-label="Open Google in a new tab" title="Open Google"><span aria-hidden="true">G</span></a>
</body>
</html>
